name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install mosquitto
        run: sudo apt-get update && sudo apt-get install -y mosquitto
      # Ubuntu's mosquitto AppArmor profile stops it reading the tests'
      # configs under /tmp (as in sweeney/common's mqttpub workflow).
      - name: let mosquitto read the tests' configs
        run: |
          ls /etc/apparmor.d/ | grep -i mosquitto || echo "no mosquitto AppArmor profile"
          for p in /etc/apparmor.d/*mosquitto*; do
            [ -f "$p" ] && sudo apparmor_parser -R "$p" && echo "unloaded $p"
          done
          true
      - name: build
        run: go build -trimpath ./...
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; gofmt -d .; exit 1; }
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: spec lint
        run: npx --yes @stoplight/spectral-cli@6.11.1 lint internal/httpapi/openapi.yaml
      - name: core packages are isolated
        run: go test -run TestCorePackagesAreIsolated .
      - name: test
        run: go test -race -cover ./...

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The live page's test reads the wire goldens from common/wire's module.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install mosquitto and shellcheck
        run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients shellcheck
      - name: tools tests
        run: tools/test.sh
      - name: scripts tests
        run: |
          (cd scripts && python3 -m unittest -q fixture_test)
          scripts/make_fixture_test.sh
          shellcheck -S warning scripts/make-fixture.sh scripts/make_fixture_test.sh
      - name: deploy scripts tests
        run: |
          deploy/bootstrap_test.sh
          deploy/deploy_test.sh
          shellcheck -S warning deploy/*.sh
