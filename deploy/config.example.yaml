# washhouse's local config: how to reach the broker and serve HTTP, and
# where things are on the broker. Behaviour (the cylinders, the meter's
# draw rules, every threshold) is in the behaviour document, not here.
# The real file is /etc/washhouse/config.yaml (deploy/config.local.yaml,
# gitignored); these values are examples.
mqtt:
  broker: tcp://broker.example:1883
  client_id: washhouse            # optional: washhouse-<hostname>
  username: washhouse             # optional
  password_file: /etc/washhouse/mqtt-password   # optional; one line
  # What washhouse publishes under (test/water/hot to try it).
  base_topic: water/hot
  tanktemp_topic: water/hot/tanktemp
  boiler_topic: energy/boiler/sensor
http:
  listen: 127.0.0.1:8095
  public_url: https://washhouse.example   # optional: the API spec's server
  # Whether a token must name washhouse as its audience: off, warn (accept
  # one that doesn't, and log it) or enforce. Run warn until the log shows
  # every caller's tokens do.
  audience: warn
# The behaviour document is the config service's namespace (its shape is
# testdata/behaviour.example.json); washhouse refuses to start without it,
# and SIGHUP fetches it again.
remote_config:
  base_url: https://config.example
  namespace: washhouse
# The client washhouse reads the namespace as (client credentials).
identity:
  base_url: https://id.example
  client_id: washhouse
  client_secret_file: /etc/washhouse/client-secret   # one line
# The property this washhouse reports for: the site tag on every Influx
# point (an id in the config service's sites namespace, as statehouse's).
site:
  id: home
# Where the history goes (optional: leave the section out for none). The
# measurements are in the README.
influx:
  url: http://localhost:8086
  org: home
  bucket: washhouse
  token_file: /etc/washhouse/influx-token   # one line
# How often washhouse's status topic carries a HEARTBEAT.
heartbeat: 15m
